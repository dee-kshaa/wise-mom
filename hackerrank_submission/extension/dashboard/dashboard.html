<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WISE MOM Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <h1>WISE MOM Dashboard</h1>
  <section class="grid">
    <div class="card"><h3>Today's spending</h3><p id="daily">₹0</p></div>
    <div class="card"><h3>Weekly spending</h3><p id="weekly">₹0</p></div>
    <div class="card"><h3>Monthly spending</h3><p id="monthly">₹0</p></div>
    <div class="card"><h3>Remaining budget</h3><p id="remaining">₹0</p></div>
  </section>
  <section class="card">
    <h3>Category Breakdown</h3>
    <ul id="categories"></ul>
  </section>
  <section class="card">
    <h3>Wise Mom insights</h3>
    <p id="insight">Beta, keep essentials first and rewards small.</p>
  </section>
  <script src="dashboard.js"></script>
</body>
</html>
